{{- with .Params.serviceType }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "serviceType": {{ . | jsonify }},
  "name": {{ $.Title | jsonify }},
  "description": {{ $.Description | jsonify }},
  "url": "{{ $.Permalink }}",
  "areaServed": { "@type": "Place", "name": "Munich, Germany" },
  "provider": {
    "@type": "Person",
    "name": "{{ $.Site.Params.author }}",
    "url": "{{ $.Site.BaseURL }}"
  }
}
</script>
{{- end }}
{{- with .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $item := . }}{{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $item.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ $item.a | jsonify }} }
    }
    {{- end }}
  ]
}
</script>
{{- end }}
